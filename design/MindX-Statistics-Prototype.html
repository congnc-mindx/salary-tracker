'use strict';
const $=s=>document.querySelector(s),fmt=new Intl.NumberFormat('vi-VN'),money=n=>fmt.format(Math.round(n))+' đ',hours=n=>fmt.format(n)+' giờ',compact=n=>fmt.format(Math.round(n/10000)/100)+' tr';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const types={class:{name:'Lớp chính',c:'var(--class)'},makeup:{name:'Dạy bù',c:'var(--makeup)'},substitute:{name:'Dạy thay',c:'var(--sub)'},judge:{name:'Giám khảo',c:'var(--judge)'},trial:{name:'Trải nghiệm',c:'var(--trial)'}};
const classes=[{id:'a',name:'OCP-GB07',campus:'Ocean Park',days:[7,14,21,28],time:'10:00',first:9,total:14},{id:'b',name:'NVC-JSB14',campus:'Nguyễn Văn Cừ',days:[7,14,21,28],time:'14:00',first:5,total:14},{id:'c',name:'MK-PTB44',campus:'Minh Khai',days:[2,9,16,23],time:'19:00',first:11,total:14},{id:'d',name:'OCP-GI02',campus:'Ocean Park',days:[1,8,15,22],time:'16:00',first:3,total:14}];
let page='overview',period='2026-11',scenario='normal',selectedFilter='all',search='',campus='',slotFilter='all';const snapshot=Date.parse('2026-11-14T12:00:00+07:00');
const iso=(m,d)=>m+'-'+String(d).padStart(2,'0'),dateVN=d=>d.split('-').reverse().join('/');
const end=r=>{const [h,m]=r.time.split(':').map(Number),mins=h*60+m+r.hours*60;return String(Math.floor(mins/60)%24).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')};
function baseRows(m){let rows=classes.flatMap(c=>c.days.map((d,i)=>({id:m+c.id+d,classId:c.id,name:c.name,campus:c.campus,type:'class',date:iso(m,d),time:c.time,hours:2,amount:320000,no:c.first+i})));rows.push({id:m+'e1',name:'NVC-JSB14',campus:'Nguyễn Văn Cừ',type:'makeup',date:iso(m,10),time:'17:00',hours:1,amount:120000},{id:m+'e2',name:'MK-PTB44',campus:'Minh Khai',type:'makeup',date:iso(m,20),time:'17:00',hours:2,amount:240000},{id:m+'s',name:'OCP-PREA05',campus:'Ocean Park',type:'substitute',date:iso(m,18),time:'08:00',hours:2,amount:320000},{id:m+'j',name:'MK-JSA',campus:'Minh Khai',type:'judge',date:iso(m,26),time:'19:00',hours:2,amount:320000});if(m==='2026-10')rows=rows.filter(r=>!['judge','substitute'].includes(r.type)&&r.id!==m+'b7'&&r.id!==m+'a28');if(m==='2026-09')rows=rows.filter(r=>r.type==='class');return rows;}
function rowsFor(m){if(['empty','leave'].includes(scenario)||!['2026-09','2026-10','2026-11'].includes(m)||scenario==='zero'&&m==='2026-10'||scenario==='short'&&m!=='2026-11')return [];let rows=baseRows(m);if(scenario==='extras')rows=rows.filter(r=>r.type!=='class');if(scenario==='single')rows=rows.filter(r=>r.type==='class'||r.id===m+'e1');if(scenario==='long')rows=rows.map(r=>({...r,name:r.name==='OCP-GB07'?'OCP-GB07-LỚP-LẬP-TRÌNH-THIẾT-KẾ-SẢN-PHẨM':r.name}));if(scenario==='many'&&m==='2026-11')rows=rows.map((r,i)=>i<6?{...r,date:iso(m,14),time:String(6+i*2).padStart(2,'0')+':00'}:r);return rows.map(r=>({...r,done:Date.parse(r.date+'T'+r.time+':00+07:00')+r.hours*3600000<=snapshot})).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));}
function sum(rows){return rows.reduce((s,r)=>({count:s.count+1,hours:s.hours+r.hours,total:s.total+r.amount,done:s.done+(r.done?1:0),doneHours:s.doneHours+(r.done?r.hours:0),doneMoney:s.doneMoney+(r.done?r.amount:0)}),{count:0,hours:0,total:0,done:0,doneHours:0,doneMoney:0});}
function modal(title,html){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=html+'<p class="note">Dữ liệu mẫu · Không kết nối Firebase.</p>';$('#dialog').showModal();}
function rowHTML(r){return `<button class="row" data-row="${r.id}"><div class="time">${r.time}<small>${end(r)}</small></div><div class="fill"><div class="class-title">${escape(r.name)}</div><small>${r.no?'Buổi '+r.no+'/14 · ':''}${types[r.type].name} · ${escape(r.campus)}</small></div><span class="tag ${r.done?'':'attention'}">${r.done?'Đã dạy':'Sắp tới'}</span><span aria-hidden="true">›</span></button>`;}
function detail(r){modal(r.name,`<p>${dateVN(r.date)} · <strong>${r.time}–${end(r)}</strong>${r.no?' · Buổi '+r.no+'/14':''}</p><dl><dt>Loại buổi</dt><dd>${types[r.type].name}</dd><dt>Cơ sở</dt><dd>${escape(r.campus)}</dd><dt>Thời lượng</dt><dd>${hours(r.hours)}</dd><dt>Tiền công</dt><dd>${money(r.amount)}</dd><dt>Trạng thái</dt><dd>${r.done?'Đã dạy':'Còn lại dự kiến'}</dd></dl><p class="notice">${r.type==='makeup'?'160.000 đ/giờ × 75% × '+hours(r.hours):'Theo mức buổi trong bộ dữ liệu mẫu'}. Không phải xác nhận đã nhận lương.</p>`);}
function listModal(title,rows){modal(title,rows.length?rows.map(r=>`<div class="row"><div class="fill"><strong>${escape(r.name)}</strong><br><small>${dateVN(r.date)} · ${r.time}–${end(r)}${r.no?' · Buổi '+r.no:''} · ${r.done?'Đã dạy':'Dự kiến'}</small></div><strong>${money(r.amount)}</strong></div>`).join(''):'<p>Không có lịch trong phạm vi này.</p>');}
function incomeHTML(s){return `<section class="panel"><div class="heading"><div><h2>Thu nhập theo lịch dạy</h2><small>Tháng công · không phải tháng nhận lương</small></div><span class="sample">Dữ liệu mẫu</span></div><div class="income"><div><div class="eyebrow">Dự kiến cả tháng</div><div class="value total">${money(s.total)}</div><small>Bao gồm phần đã dạy</small></div><div><div class="eyebrow">Đã dạy</div><div class="value">${money(s.doneMoney)}</div><small>${s.done} buổi · ${hours(s.doneHours)}</small></div><div><div class="eyebrow">Còn lại dự kiến</div><div class="value">${money(s.total-s.doneMoney)}</div><small>${s.count-s.done} buổi · ${hours(s.hours-s.doneHours)}</small></div></div><p class="equation">Đã dạy + Còn lại dự kiến = Dự kiến cả tháng. Tiền công đã tạo ra không đồng nghĩa lương đã nhận.</p></section>`;}
function progressHTML(s){return `<section class="panel"><div class="heading"><div><h2>Tiến độ tháng</h2><small>Theo lịch sau điều chỉnh</small></div></div><div class="progress-head"><div class="big">${s.done}<small> / ${s.count} buổi</small></div><span class="tag">${s.count?Math.round(s.done/s.count*100):0}% đã dạy</span></div><div class="progress" role="progressbar" aria-label="Buổi đã dạy" aria-valuemin="0" aria-valuemax="${s.count||1}" aria-valuenow="${s.done}"><i style="width:${s.count?s.done/s.count*100:0}%"></i></div><div class="split"><span><b>${s.done}</b>Đã dạy</span><span><b>${s.count-s.done}</b>Còn lại</span></div><div class="hours"><div><small>Tổng thời lượng</small><h2>${hours(s.hours)}</h2></div><small>${hours(s.doneHours)} đã dạy<br>${hours(s.hours-s.doneHours)} còn lại</small></div></section>`;}
function actionHTML(rows){const isCurrent=period==='2026-11',today=rows.filter(r=>r.date==='2026-11-14'),upcoming=rows.filter(r=>!r.done&&r.date>'2026-11-14'),chosen=isCurrent?(today.length?today:upcoming.slice(0,2)):rows.slice(-3);return `<section class="panel"><div class="heading"><div><h2>${isCurrent?(today.length?'Hôm nay · 14/11':'Buổi sắp tới'):'Lịch trong tháng'}</h2><small>${isCurrent?(today.length?today.length+' ca · xếp theo giờ bắt đầu':'Không có ca hôm nay'):'Tháng đã kết thúc · các ca cuối tháng'}</small></div><span class="tag attention">${isCurrent?'Ưu tiên hôm nay':'Lịch sử'}</span></div>${chosen.slice(0,3).map(rowHTML).join('')||'<p class="muted">Không có lịch cần thực hiện.</p>'}${chosen.length>3?`<button class="inspect-link" data-day="2026-11-14">Xem đủ ${chosen.length} ca hôm nay →</button>`:''}${isCurrent&&upcoming.length?`<div class="group-label">TIẾP THEO · ${dateVN(upcoming[0].date)}</div>${rowHTML(upcoming[0])}`:''}<button class="inspect-link" id="allSchedule">Mở lịch ${rows.length} buổi trong tháng →</button></section>`;}
function milestonesHTML(rows){const next=classes.map(c=>rows.find(r=>r.classId===c.id&&!r.done&&[5,9,14].includes(r.no))).filter(Boolean);return `<section class="panel"><div class="heading"><div><h2>Mốc cần chú ý</h2><small>Buổi 5 · 9 · 14, theo lịch hiện tại</small></div></div>${next.map(r=>`<button class="row" data-row="${r.id}"><span class="tag attention">Buổi ${r.no}</span><span class="fill"><strong>${escape(r.name)}</strong><br><small>${dateVN(r.date)} · ${r.time}–${end(r)}</small></span><span>›</span></button>`).join('')||'<p class="muted">Không có mốc sắp tới trong tháng.</p>'}</section>`;}
function leaveHTML(){if(period!=='2026-11')return '<section class="panel"><h2>Ngày nghỉ & điều chỉnh</h2><p class="muted">Chưa có điều chỉnh trong tháng mẫu này.</p></section>';return `<section class="panel"><div class="heading"><div><h2>Ngày nghỉ & điều chỉnh</h2><small>Các khoản này không bị trừ thêm vào tổng</small></div></div><button class="row" id="postponed"><span class="fill"><strong>${scenario==='leave'?'Nghỉ 01/11–02/12':'1 buổi chuyển sang tháng sau'}</strong><br><small>${scenario==='leave'?'Không có lịch hưởng công trong tháng mẫu':'OCP-GI02 · 29/11 → 06/12'}</small></span><span>›</span></button><button class="row" id="covered"><span class="fill"><strong>${scenario==='leave'?'Các buổi trong khoảng nghỉ':'1 buổi người khác dạy thay'}</strong><br><small>${scenario==='leave'?'Chạm để xem cách xử lý':'Không tính công · 320.000 đ'}</small></span><span>›</span></button></section>`;}
function compareHTML(rows){const prev=(()=>{const d=new Date(period+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()-1);return d.toISOString().slice(0,7)})(),p=rowsFor(prev),isCurrent=period==='2026-11';const cutoff=r=>Number(r.date.slice(8))<14||Number(r.date.slice(8))===14&&r.time<'12:00'&&end(r)<='12:00';const cur=sum(isCurrent?rows.filter(r=>r.done):rows),old=sum(isCurrent?p.filter(cutoff):p),delta=cur.total-old.total;return `<section class="panel"><h2>${isCurrent?'So cùng kỳ tháng trước':'So với tháng trước'}</h2><p class="note">${isCurrent?'Chỉ các buổi kết thúc đến 12:00 ngày 14 của mỗi tháng; không so cả tháng trước với tháng đang dở.':'Cả hai tháng đã kết thúc; so tổng lịch sau điều chỉnh.'}</p><div class="compare"><div><small>Tiền công ${delta>=0?'tăng':'giảm'}</small><b>${delta>0?'+':''}${money(delta)}</b></div><div><small>Số buổi thay đổi</small><b>${cur.count-old.count>0?'+':''}${cur.count-old.count} buổi</b></div><div><small>Thời lượng thay đổi</small><b>${cur.hours-old.hours>0?'+':''}${hours(cur.hours-old.hours)}</b></div></div><p class="note">${old.total?fmt.format(Math.round(delta/old.total*1000)/10)+'% về tiền công so với cùng phạm vi tháng trước.':'Tháng trước bằng 0 hoặc chưa có dữ liệu; không tính phần trăm tăng.'} Chưa đủ cơ sở kết luận xu hướng dài hạn.</p></section>`;}
function sourcesHTML(rows){const s=sum(rows),groups=Object.entries(types).map(([key,t])=>({key,...t,...sum(rows.filter(r=>r.type===key))})).filter(g=>g.count).sort((a,b)=>b.total-a.total);const max=Math.max(1,...groups.map(g=>g.total));return `<section class="panel"><div class="heading"><div><h2>Tiền công đến từ đâu?</h2><small>Sắp theo giá trị · chạm thanh để xem buổi</small></div></div>${groups.map(g=>`<button class="source" data-type="${g.key}" style="--c:${g.c}"><div class="source-top"><span><i class="dot" style="color:${g.c}"></i> ${g.name}</span><strong>${money(g.total)}</strong></div><div class="bar"><i class="solid" style="width:${g.doneMoney/max*100}%"></i><i class="forecast" style="width:${(g.total-g.doneMoney)/max*100}%"></i></div><small>${g.count} buổi · ${hours(g.hours)} · ${s.total?fmt.format(Math.round(g.total/s.total*1000)/10):0}%</small></button>`).join('')||'<p class="muted">Chưa có thu nhập trong tháng.</p>'}<div class="legend"><span><i></i>Đã dạy</span><span><i class="hatch"></i>Còn lại dự kiến</span></div></section>`;}
function rankingHTML(rows){const groups=[...new Set(rows.map(r=>r.name))].map(name=>({name,...sum(rows.filter(r=>r.name===name))})).sort((a,b)=>b.total-a.total);return `<section class="panel"><div class="heading"><div><h2>Lớp đóng góp trong tháng</h2><small>Gộp đúng các buổi của lớp · không cộng thêm lần nữa</small></div></div>${groups.map(g=>`<button class="row" data-group="${escape(g.name)}"><span class="fill"><strong>${escape(g.name)}</strong><br><small>${g.count} buổi · ${hours(g.hours)}</small></span><strong>${money(g.total)}</strong><span>›</span></button>`).join('')}</section>`;}
function trendHTML(){const months=['2026-09','2026-10','2026-11'].filter(m=>scenario!=='short'||m==='2026-11'),items=months.map(m=>({m,...sum(rowsFor(m))})),max=Math.max(1,...items.map(x=>x.total));return `<section class="panel"><div class="heading"><div><h2>Thu nhập theo tháng công</h2><small>${months.length<3?'Chưa đủ 3 tháng để nhận định xu hướng.':'3 tháng trong phạm vi mẫu · tháng 11 gồm phần dự kiến.'}</small></div></div><div class="chart" role="group" aria-label="Biểu đồ cột thu nhập tháng">${items.map(x=>`<button class="column" data-trend="${x.m}" aria-label="Tháng ${Number(x.m.slice(5))}: ${money(x.total)}, đã dạy ${money(x.doneMoney)}"><span class="amount">${compact(x.total)}</span><span class="stacks" style="height:${x.total/max*155}px"><i class="done" style="height:${x.total?x.doneMoney/x.total*100:0}%"></i><i class="future" style="height:${x.total?(x.total-x.doneMoney)/x.total*100:0}%"></i></span><span class="xlabel">T${Number(x.m.slice(5))}/2026</span><span class="col-tip" role="tooltip">${money(x.total)}<br>${x.count} buổi · ${hours(x.hours)}</span></button>`).join('')}</div><div class="legend"><span><i></i>Đã dạy</span><span><i class="hatch"></i>Còn lại dự kiến</span></div></section>`;}
function classesHTML(rows){const cards=classes.map(c=>{const r=rows.filter(r=>r.classId===c.id),done=r.filter(x=>x.done),next=r.find(x=>!x.done),progress=done.length?done.at(-1).no:c.first-1;return {c,r,next,progress,completed:progress>=c.total};}).filter(x=>x.r.length&&(!search||(x.r[0].name+' '+x.c.campus).toLowerCase().includes(search.toLowerCase()))&&(!campus||x.c.campus===campus)&&(selectedFilter==='completed'?x.completed:!x.completed&&(selectedFilter==='all'||selectedFilter==='soon'&&x.progress===0||Number(selectedFilter)===x.next?.no))&&(slotFilter==='all'||slotFilter==='today'&&x.next?.date==='2026-11-14'));return `<section class="panel"><div class="filter"><label>Tìm kiếm<input id="search" placeholder="Mã lớp, cơ sở…" value="${escape(search)}"></label><label>Trạng thái<select id="classFilter">${[['all','Tất cả các lớp'],['soon','Sắp khai giảng'],['5','Sắp tới buổi 5'],['9','Sắp tới buổi 9'],['14','Sắp tới buổi 14'],['completed','Đã hoàn thành']].map(([v,l])=>`<option value="${v}" ${v===selectedFilter?'selected':''}>${l}</option>`).join('')}</select></label><label>Cơ sở<select id="campus"><option value="">Tất cả cơ sở</option>${[...new Set(classes.map(c=>c.campus))].map(c=>`<option ${campus===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Buổi tiếp theo<select id="slot"><option value="all">Tất cả buổi</option><option value="today" ${slotFilter==='today'?'selected':''}>Hôm nay</option></select></label></div><p class="note">Hiển thị ${cards.length} lớp · ${selectedFilter==='completed'?'Lớp đã hoàn thành':'Đang ẩn lớp đã hoàn thành'} · Tháng trên header</p></section><div class="class-grid">${cards.map(({c,r,next,progress})=>`<button class="class-card" data-class="${c.id}"><div class="class-title">${escape(r[0].name)} <span aria-hidden="true">›</span></div><p>${next?'Buổi '+next.no+' · '+dateVN(next.date)+' · '+next.time+'–'+end(next):'Đã hoàn thành lịch trong tháng'}</p><div class="split"><span>${progress===0?'Sắp khai giảng':'Đã học'}</span><strong>${progress}/${c.total} buổi</strong></div><div class="progress"><i style="width:${Math.min(100,progress/c.total*100)}%"></i></div><small>${r.length} buổi trong tháng${next&&[5,9,14].includes(next.no)?' · Mốc buổi '+next.no:''}</small></button>`).join('')}</div>${!cards.length?'<div class="panel empty"><h2>Không có lớp phù hợp</h2><p>Thử bộ lọc khác hoặc chuyển tháng trên header.</p></div>':''}`;}
const navs=[['overview','⌂','Tổng quan'],['classes','▣','Lớp học của tôi'],['extras','◷','Lịch phát sinh'],['holidays','▦','Ngày nghỉ'],['stats','◴','Thống kê'],['reviews','▤','Nhận xét'],['settings','⚙','Cài đặt']];
function render(){const rows=rowsFor(period),s=sum(rows);$('#month').textContent='Tháng '+Number(period.slice(5))+'/'+period.slice(0,4);$('#title').textContent={overview:'Tổng quan',stats:'Thống kê thu nhập',classes:'Lớp học của tôi'}[page];$('#subtitle').textContent={overview:'Lịch cần chú ý và tiến độ giảng dạy',stats:'Tháng công · lịch sau điều chỉnh',classes:'Quản lý lớp học và theo dõi tiến độ giảng dạy'}[page];$('#book').classList.toggle('hidden',page==='stats');$('#book').textContent=page==='classes'?'+ Thêm lớp':'+ Book lịch';$('#nav').innerHTML=navs.map(([k,i,n])=>`<button data-nav="${k}" ${k===page?'aria-current="page"':''}><span aria-hidden="true">${i}</span>${n}</button>`).join('');$('#mobileNav').innerHTML=navs.map(([k,i,n])=>`<button data-nav="${k}" ${k===page?'aria-current="page"':''}>${i}<br>${n}</button>`).join('');let html='';if(scenario==='loading')html='<section class="panel loading" role="status" aria-busy="true"><h2>Đang tải lịch và thu nhập…</h2><p class="note">Chưa hiển thị số tiền khi dữ liệu chưa sẵn sàng.</p><div class="skeleton"></div><div class="skeleton"></div></section>';else if(scenario==='error')html='<section class="panel empty" role="alert"><h2>Chưa tải được dữ liệu</h2><p>Không hiển thị số 0 thay cho dữ liệu tải lỗi.</p><button class="primary" id="retry">Thử lại dữ liệu mẫu</button></section>';else if(!rows.length&&scenario!=='leave')html='<section class="panel empty"><h2>Tháng này chưa có lịch dạy</h2><p>Chuyển tháng bằng header để xem dữ liệu khác.</p><span class="sample">Dữ liệu mẫu</span></section>';else if(page==='overview')html=`<div class="twocol">${actionHTML(rows)}${progressHTML(s)}</div>${incomeHTML(s)}<div class="twocol">${milestonesHTML(rows)}${leaveHTML()}</div>`;else if(page==='stats')html=`<div class="tabstrip"><button aria-pressed="true" disabled>Thống kê</button><button id="payroll">Đối soát bảng lương</button></div>${incomeHTML(s)}${compareHTML(rows)}<div class="twocol">${sourcesHTML(rows)}${progressHTML(s)}</div>${trendHTML()}<div class="twocol">${rankingHTML(rows)}${leaveHTML()}</div>`;else html=classesHTML(rows);$('#content').innerHTML=html;bind(rows);}
function bind(rows){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(['overview','stats','classes'].includes(b.dataset.nav)){page=b.dataset.nav;render();}else modal(b.textContent.trim(),'<p>Trang hiện có được giữ nguyên. Prototype này chỉ duyệt Tổng quan, Thống kê và khả năng đọc thẻ lớp.</p>');});document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>detail(rows.find(r=>r.id===b.dataset.row)));document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>listModal(types[b.dataset.type].name,rows.filter(r=>r.type===b.dataset.type)));document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>listModal(b.dataset.group,rows.filter(r=>r.name===b.dataset.group)));document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>listModal(classes.find(c=>c.id===b.dataset.class).name,rows.filter(r=>r.classId===b.dataset.class)));document.querySelectorAll('[data-trend]').forEach(b=>b.onclick=()=>listModal('Tháng '+b.dataset.trend,rowsFor(b.dataset.trend)));document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>listModal('Lịch hôm nay · 14/11/2026',rows.filter(r=>r.date===b.dataset.day)));if($('#allSchedule'))$('#allSchedule').onclick=()=>listModal('Lịch tháng '+period,rows);if($('#postponed'))$('#postponed').onclick=()=>modal('Buổi bị lùi',scenario==='leave'?'<p>Nghỉ cá nhân 01/11–02/12. Trong bộ dữ liệu mẫu này, các buổi được dời ra ngoài tháng 11 nên tháng 11 không phát sinh tiền công.</p>':'<p>OCP-GI02 · Buổi 7</p><p>29/11/2026 16:00–18:00 → 06/12/2026 16:00–18:00.</p><p>320.000 đ sẽ thuộc tháng công 12. Không tính trong tháng 11 và không trừ thêm vào tổng.</p>');if($('#covered'))$('#covered').onclick=()=>modal('Ảnh hưởng ngày nghỉ','<p>OCP-GB07 · 30/11/2026 · 10:00–12:00</p><p>Người khác dạy thay: không tính 320.000 đ vào công của bạn. Dòng này không nằm trong tập buổi hưởng công và không trừ thêm lần hai.</p>');if($('#retry'))$('#retry').onclick=()=>{$('#scenario').value=scenario='normal';render()};if($('#payroll'))$('#payroll').onclick=()=>modal('Đối soát bảng lương','<p>Giữ nguyên tính năng đã triển khai. Prototype không nhập bảng lương hoặc thay lịch sử đối soát.</p>');if($('#classFilter'))$('#classFilter').onchange=e=>{selectedFilter=e.target.value;render()};if($('#campus'))$('#campus').onchange=e=>{campus=e.target.value;render()};if($('#slot'))$('#slot').onchange=e=>{slotFilter=e.target.value;render()};if($('#search'))$('#search').oninput=e=>{const pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};}
$('#close').onclick=()=>$('#dialog').close();$('#dialog').onclick=e=>{if(e.target===$('#dialog')){const b=e.target.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)e.target.close()}};
$('#size').onchange=e=>{$('#shell').style.maxWidth=e.target.value==='full'?'1600px':e.target.value+'px'};$('#theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;$('#toggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;$('#theme').value=next};$('#scenario').onchange=e=>{scenario=e.target.value;render()};function shift(n){let [y,m]=period.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}period=y+'-'+String(m).padStart(2,'0');render()}$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);$('#today').onclick=()=>{period='2026-11';render()};$('#month').onclick=()=>modal('Chọn tháng',`<label>Tháng công <input id="pickMonth" type="month" value="${period}" style="min-height:44px;margin:15px"></label><button id="applyMonth" class="primary" onclick="period=document.querySelector('#pickMonth').value||period;document.querySelector('#dialog').close();render()">Xem tháng</button>`);$('#book').onclick=()=>modal('Form hiện có được giữ nguyên','<p>Thêm lớp / Book lịch nằm ngoài phạm vi prototype. Khi tích hợp sẽ mở đúng form hiện tại, không tạo lịch mẫu vào dữ liệu thật.</p>');$('#alerts').onclick=()=>listModal('Mốc cần chú ý',rowsFor(period).filter(r=>r.no&&[5,9,14].includes(r.no)&&!r.done));$('#logout').onclick=()=>modal('Đăng xuất','<p>Prototype không có phiên đăng nhập. Layout đăng nhập và cơ chế xác thực hiện tại được giữ nguyên.</p>');render();
window.prototypeData=()=>({period,scenario,rows:rowsFor(period),summary:sum(rowsFor(period))});
</script></body></html>
